# Render.com Configuration for CampusSphere Backend
services:
  - type: web
    name: campus-sphere-backend
    runtime: python
    plan: free

    #Root directory of the backend service
    # Adjust this if your backend code is not in the root of the repository
    rootDir: backend

    # Build and deployment settings
    # Render manages the environment automatically; manual venv creation is optional but included here per your logic
    buildCommand: |
      pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput

    # Start command for the service
    # Gunicorn will serve the Django application
    startCommand: |
      daphne -b 0.0.0.0 -p 10000 --access-log - --proxy-headers -t 120 campus_sphere.asgi:application
      
    # Environment variables
    envVars:
      - key: PORT
        value: "10000"
      # Uncomment and update these as needed
      # - key: DEBUG
      #   value: "False"
      # - key: SECRET_KEY
      #   value: "your-secret-key"
      # - key: ALLOWED_HOSTS
      #   value: "your-render-domain.onrender.com,your-vercel-domain.vercel.app"
      # - key: DATABASE_URL
      #   value: "postgresql://..."
      # - key: REDIS_URL
      #   value: "redis://..."
      # - key: JWT_SECRET
      #   value: "your-jwt-secret"

    # Health check configuration
    # Note: Render Blueprints use specific keys for health check parameters
    healthCheckPath: /api/health/

# Optional: If you want Render to also manage your Database
databases:
  - name: campus-sphere-db
    plan: free # or 'standard'    
