version: '3.8'

services:
  # Django Application
  web:
    build: .
    command: gunicorn campus_sphere.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://campus_user:campus_password@db:5432/campus_sphere
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=your-production-secret-key-here
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # WebSocket Server
  websocket:
    build: .
    command: daphne campus_sphere.asgi:application --bind 0.0.0.0 --port 8001
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://campus_user:campus_password@db:5432/campus_sphere
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=your-production-secret-key-here
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # Celery Worker
  celery:
    build: .
    command: celery -A campus_sphere worker -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://campus_user:campus_password@db:5432/campus_sphere
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=your-production-secret-key-here
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # PostgreSQL Database
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=campus_sphere
      - POSTGRES_USER=campus_user
      - POSTGRES_PASSWORD=campus_password
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - websocket
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume: