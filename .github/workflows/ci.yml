name: CI Pipeline

on:
  push:
    branches:
      - main
      - migration/frontend-upgrade
  pull_request:
    branches:
      - main
      - migration/frontend-upgrade

jobs:
  validate:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @cs/backend exec prisma generate

      - name: Typecheck (Turborepo)
        run: pnpm typecheck

      - name: Lint (Turborepo)
        run: pnpm lint

      - name: Unit Tests (Vitest)
        run: pnpm test

      - name: Production Builds (Turborepo)
        run: pnpm build
